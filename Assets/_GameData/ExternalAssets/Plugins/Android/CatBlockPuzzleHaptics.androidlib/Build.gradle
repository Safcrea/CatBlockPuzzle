plugins {
    id 'com.android.library'
}

android {
    namespace 'com.safi.catblockpuzzle.haptics'

    // Must be a platform the editor's bundled SDK has installed (6000.5 ships android-34 and android-36); an uninstalled
    // one makes Gradle try to download it and fail on the unaccepted licence.
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        minSdk 23
    }

    // The manifest lives at the root of this library, not in src/main. Without this line Gradle generates an
    // empty manifest, the VIBRATE permission never reaches the app and every vibration is silently refused.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
        }
    }
}
